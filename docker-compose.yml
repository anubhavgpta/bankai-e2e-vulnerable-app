version: "3.8"

services:
  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app/backend
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - .:/app
      - ./uploads:/app/backend/uploads
    environment:
      APP_ENV: development
      DEBUG: "true"
      JWT_SECRET: bankai-compose-fake-jwt-secret
      DATABASE_PASSWORD: fake-compose-db-password
      AWS_SECRET_ACCESS_KEY: fakeComposeAwsSecretForTestingOnly
  frontend:
    image: node:16
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_ANALYTICS_KEY: pk_live_fake_compose_analytics_123
